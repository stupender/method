<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The mark: a triad whose three dots overlap into the four degrees between
       them. Same geometry and same palette as src/ui/Mark.tsx — the colours are
       hard-coded here because a favicon can't reach the app's CSS variables.
       If the palette in src/index.css moves, move these with it. -->
  <defs>
    <clipPath id="a"><circle cx="50" cy="37.5" r="29"/></clipPath>
    <clipPath id="b"><circle cx="35.3" cy="63" r="29"/></clipPath>
    <clipPath id="c"><circle cx="64.7" cy="63" r="29"/></clipPath>
    <clipPath id="bc"><circle cx="35.3" cy="63" r="29" clip-path="url(#c)"/></clipPath>
  </defs>
  <circle cx="50" cy="37.5" r="29" fill="#ab4436"/>
  <circle cx="35.3" cy="63" r="29" fill="#d9ac3c"/>
  <circle cx="64.7" cy="63" r="29" fill="#3a7a9c"/>
  <circle cx="50" cy="37.5" r="29" fill="#c47a1e" clip-path="url(#b)"/>
  <circle cx="35.3" cy="63" r="29" fill="#55823f" clip-path="url(#c)"/>
  <circle cx="50" cy="37.5" r="29" fill="#8a5f9e" clip-path="url(#c)"/>
  <circle cx="50" cy="37.5" r="29" fill="#55639e" clip-path="url(#bc)"/>
</svg>
